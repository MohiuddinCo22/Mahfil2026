<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লগইন — মিলাদুন্নবী মাহফিল হিসাব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-crescent">☪</div>
    <h1>মিলাদুন্নবী মাহফিল হিসাব</h1>
    <div class="sub">কমিটি মেম্বার লগইন</div>

    <div id="msg" class="msg error"></div>

    <form id="loginForm">
      <label for="email">ইমেইল</label>
      <input type="email" id="email" required placeholder="you@example.com" style="margin-bottom:14px;">
      <label for="password">পাসওয়ার্ড</label>
      <input type="password" id="password" required placeholder="••••••••" style="margin-bottom:20px;">
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">লগইন করুন</button>
    </form>
    <p style="text-align:center; font-size:12.5px; color:var(--muted); margin-top:18px;">
      অ্যাকাউন্ট নেই? Firebase Console থেকে অ্যাডমিন আপনার জন্য অ্যাকাউন্ট তৈরি করে দেবেন।
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  // Already logged in? go straight to app.
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = 'app.html';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    msg.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'লগইন হচ্ছে...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    auth.signInWithEmailAndPassword(email, password)
      .then(() => { window.location.href = 'app.html'; })
      .catch(err => {
        btn.disabled = false;
        btn.textContent = 'লগইন করুন';
        let text = 'লগইন ব্যর্থ হয়েছে। ইমেইল বা পাসওয়ার্ড ঠিক আছে কিনা দেখুন।';
        if (err.code === 'auth/invalid-email') text = 'ইমেইল ঠিকভাবে দিন।';
        if (err.code === 'auth/too-many-requests') text = 'অনেকবার চেষ্টা হয়েছে, একটু পরে আবার চেষ্টা করুন।';
        msg.textContent = text;
        msg.classList.add('show');
      });
  });
</script>
</body>
</html>
